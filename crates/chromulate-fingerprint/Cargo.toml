[package]
name = "chromulate-fingerprint"
description = "TLS ClientHello and HTTP/2 fingerprint models with JA3, JA4 and Akamai computation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
hex.workspace = true
md-5.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "fingerprint"
harness = false

# The `md-5` package is used below as `md5` (the Akamai and JA3 hashes);
# cargo-machete normalises `-` to `_` when searching for usage and misses it.
[package.metadata.cargo-machete]
ignored = ["md-5"]
