[package]
name = "chromulate-bench"
description = "Benchmark harness for Chromulate: end-to-end throughput against reqwest, allocation counting, and memory measurement."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
chromulate.workspace = true
chromulate-core.workspace = true
chromulate-header.workspace = true
chromulate-http.workspace = true
chromulate-profile.workspace = true

bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
reqwest.workspace = true
tokio = { workspace = true, features = ["full"] }
url.workspace = true

[[bin]]
name = "live"
required-features = ["live"]

[features]
# The live harness (`--bin live`) talks to real HTTPS origins, so its baseline
# needs a TLS stack and the decompression codings Chromulate advertises —
# otherwise the two clients would not be doing the same work.
#
# It is opt-in because enabling it changes how `reqwest` is built, and the
# loopback harnesses (`e2e`, `allocs`, `memory`) recorded their numbers against
# a `reqwest` with no TLS stack at all. Run those **without** this feature, or
# their figures are not comparable with the ones in `docs/performance.md`.
live = [
    "reqwest/rustls",
    "reqwest/http2",
    "reqwest/charset",
    "reqwest/gzip",
    "reqwest/brotli",
    "reqwest/zstd",
    "reqwest/deflate",
]

# This crate deliberately does not carry `[lints] workspace = true`.
#
# The workspace forbids `unsafe_code`, and a counting global allocator cannot be
# written without `unsafe impl GlobalAlloc`. Measuring allocations per request is
# the whole point of `src/bin/allocs.rs`, so the exception lives here, in a
# `publish = false` crate that ships in no binary a user runs. Every other file
# in this crate carries `#![forbid(unsafe_code)]` at its own top.
