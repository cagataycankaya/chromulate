[package]
name = "chromulate-http"
description = "The Chromulate HTTP engine: connection pool, HTTP/1.1 and HTTP/2, redirects, and middleware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
chromulate-core.workspace = true
chromulate-cache = { workspace = true, optional = true }
chromulate-compression.workspace = true
chromulate-dns.workspace = true
chromulate-fingerprint.workspace = true
chromulate-header.workspace = true
chromulate-profile.workspace = true
chromulate-proxy.workspace = true
chromulate-tls.workspace = true

bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rand.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
chromulate-cookie.workspace = true
flate2.workspace = true
# `test-util` for the paused clock: the default timeouts are measured in tens of
# seconds, and a test that proves one must not spend that long proving it.
tokio = { workspace = true, features = ["full", "test-util"] }
# The emitted-shape test needs a TLS origin that negotiates h2 by ALPN, because
# that is the only way this crate produces an HTTP/2 connection at all.
rcgen = "0.14"
# The same version hyper already links. `early_stop.rs` stands up an h2 origin
# with it so that a cancelled body can be observed as a `RST_STREAM` at the
# server, rather than inferred from the client staying alive.
h2 = "0.4"
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true

[features]
default = []
# Tests that reach the public internet. Off by default so `cargo test --workspace`
# stays hermetic.
network-tests = []
# Chromium's HSTS preload list, compiled into the binary. Off by default because
# it is not free: `data/hsts-preload/preload.bin` is 1,749,625 bytes and all of it
# is linked in. Measured on the release `chromulate` CLI binary, macOS arm64:
# 9,049,920 bytes without the feature, 10,816,576 with it, a growth of 1,766,656 —
# the blob plus 17,031 bytes of lookup code and alignment. What it buys is
# protection for the *first* request to an origin this process has never visited,
# which is the one case a store learned from responses cannot cover.
#
# Cargo features are additive and unify across a dependency graph, so any crate in
# the build enabling this turns it on for every consumer of `chromulate-http` in
# that build. The behaviour it adds is "upgrade more requests to HTTPS", which is
# safe to acquire unexpectedly, but it is worth knowing that is how it can arrive.
hsts-preload = []
# `ValidatorStore`: remember an `ETag`/`Last-Modified` per URL and replay it as a
# conditional request on the next visit, whether or not the response was
# storable.
#
# Off by default because it is a deliberate divergence from browser behaviour,
# not an approximation of it: Chrome does not revalidate a response it was told
# not to store, so an engine with this on is observably not a browser. See
# `validators::ValidatorStore` for what a browser does instead and for the
# measured hit rate, which is low.
validator-store = []
# An RFC 9111 HTTP cache in front of every hop. Off by default: a cache changes
# which requests reach the origin, and that is not something to inherit by
# accident. See `chromulate-cache`'s documentation for the subset implemented
# and, more importantly, for the list of what it deliberately does not do.
cache = ["dep:chromulate-cache"]

[lints]
workspace = true
