[package]
name = "chromulate"
description = "A browser-grade networking engine for Rust: requests that look, on the wire, like a browser's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
chromulate-challenge = { workspace = true, optional = true }
chromulate-compression.workspace = true
chromulate-concurrency = { workspace = true, optional = true }
chromulate-cookie.workspace = true
chromulate-core.workspace = true
chromulate-dns.workspace = true
chromulate-fingerprint.workspace = true
chromulate-http.workspace = true
chromulate-profile.workspace = true
chromulate-proxy.workspace = true
chromulate-tls.workspace = true

base64.workspace = true
bytes.workspace = true
encoding_rs.workspace = true
futures-core.workspace = true
http.workspace = true
http-body.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true

rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
# `io` for `ReaderStream`, which is the whole reason this is here: a file part
# has to reach the socket without the file reaching memory.
tokio-util = { workspace = true, optional = true, features = ["io"] }

[dev-dependencies]
flate2.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# `test-util` for the paused clock: the default timeouts are measured in tens of
# seconds, and a test that proves one must not spend that long proving it.
tokio = { workspace = true, features = ["full", "test-util"] }

[features]
default = ["json"]
# `RequestBuilder::json` and `Response::json`.
json = ["dep:serde", "dep:serde_json"]
# `RequestBuilder::form`.
form = ["dep:serde", "dep:serde_urlencoded"]
# `RequestBuilder::multipart` and the `multipart` module. `tokio/fs` is pulled
# in only here, for `Part::file`.
multipart = ["dep:rand", "dep:tokio-util", "tokio/fs"]
# Forwarded from `chromulate-http`, so a caller who depends on this crate alone —
# which is what the README tells them to do — can reach them. Without these,
# `cargo add chromulate --features cache` fails with "does not contain this
# feature" and the fix is to add a second dependency the README never mentioned.
#
# Chromium's HSTS preload list, compiled in. See `chromulate-http`'s own entry
# for what it costs.
hsts-preload = ["chromulate-http/hsts-preload"]
# The RFC 9111 cache in `chromulate-cache`.
cache = ["chromulate-http/cache"]
# Conditional revalidation independent of storability. Deliberately not browser
# behaviour — read `ValidatorStore`'s documentation before enabling it.
validator-store = ["chromulate-http/validator-store"]
# `Response::bytes_until`. The default read is the whole body either way.
early-stop = ["chromulate-http/early-stop"]
# The two per-origin concurrency laws in `chromulate-concurrency`, re-exported
# as `chromulate::concurrency`. Off by default, and a caller who enables it still
# has to install a controller — nothing changes on its own.
#
# What it no longer gates is the seam: `ConcurrencyController` comes from
# `chromulate-http` and is always present, so `ClientBuilder::concurrency` works
# with a controller of the caller's own whether or not this is on. The name is
# kept for callers who already wrote it in a manifest.
adaptive-concurrency = ["dep:chromulate-concurrency"]
# The shipped challenge detectors in `chromulate-challenge`, re-exported as part
# of `chromulate::challenge`. Off by default, and enabling it changes nothing on
# its own: a detector still has to be installed, and no middleware is installed
# for you.
#
# Named for what it gates. `adaptive-concurrency` above is the cautionary tale:
# its own comment records that the name no longer describes what it does and is
# kept only because callers had already written it in a manifest. This one was
# `challenge` for exactly as long as it took to notice the same defect being
# minted a second time, which was before any caller could depend on it.
#
# What it does **not** gate is the seam. `ChallengeDetector`, `BrowserFallback`,
# `Observation`, `Handoff` and `Handback` come from `chromulate-http` and are
# always present, exactly as `ConcurrencyController` is — so a caller writing
# their own detector, or their own fallback against a browser this project has
# never heard of, needs no feature at all. Turning this on buys the detectors
# someone else already wrote, and nothing else.
#
# There is deliberately no `ClientBuilder::challenge(...)`: the middleware is
# installed by hand for this release. A builder method is permanent public
# surface, and the measurement that would tell us what its arguments should be
# has not been run.
challenge-detectors = ["dep:chromulate-challenge"]
# Tests that reach the public internet. Off by default so `cargo test
# --workspace` stays hermetic.
network-tests = []

[[example]]
name = "simple_get"
path = "../../examples/simple_get.rs"

[[example]]
name = "streaming_download"
path = "../../examples/streaming_download.rs"

[[example]]
name = "cookie_session"
path = "../../examples/cookie_session.rs"

[[example]]
name = "custom_middleware"
path = "../../examples/custom_middleware.rs"

[[example]]
name = "proxied_request"
path = "../../examples/proxied_request.rs"

[lints]
workspace = true
