version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bumping one of these alone usually fails to build, so they travel together.
      rustls:
        patterns:
          - rustls
          - tokio-rustls
          - rustls-pki-types
          - webpki-roots
      hyper:
        patterns:
          - hyper
          - hyper-util
          - http
          - http-body
          - http-body-util

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `dtolnay/rust-toolchain@1.85.0` in the msrv job is not an action version
      # to keep current: it is the minimum supported Rust version this workspace
      # declares in `rust-version`, and the job exists to prove the crate still
      # builds on it. Dependabot reads it as a version to bump, and taking that
      # bump would leave the job passing against a newer compiler while
      # verifying nothing — the MSRV would then drift silently, which is the one
      # failure this job is here to prevent. Raising the MSRV is a deliberate
      # decision that changes `rust-version`, this pin, and CONTRIBUTING.md
      # together.
      - dependency-name: dtolnay/rust-toolchain
