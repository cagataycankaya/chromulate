name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The live network tests exercise real origins, so they drift for reasons
    # this repository never changes: a site alters its TLS terms, an echo
    # service moves, a CDN starts negotiating something else. Running them
    # nightly separates "we broke it" from "the internet moved", which a
    # per-push run cannot.
    - cron: "17 4 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The default test run is hermetic. Tests that need the public internet are
      # gated behind the `network-tests` feature and run in the separate job below.
      - run: cargo test --workspace --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # `+1.88.0` is load-bearing, for the same reason it is on the Miri and
      # fuzz jobs: `rust-toolchain.toml` pins the channel to stable and a
      # toolchain file wins over whatever the action installed. Without it this
      # job ran on stable and reported green while the declared MSRV was wrong
      # — which is exactly what happened, undetected, until an agent ran the
      # check by hand.
      - run: cargo +1.88.0 check --workspace --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  miri:
    name: Miri over chromulate-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Only `chromulate-core`, and deliberately: Miri cannot run I/O, so it
      # cannot see the crates that do any. Core is the one with no I/O at all,
      # which makes it both tractable and the right place to look — it holds
      # the body and URI types every other crate builds on.
      # `+nightly` is load-bearing: `rust-toolchain.toml` pins the channel to
      # stable, and a toolchain file wins over whatever the action installed.
      # Without it this runs `cargo miri` on stable, where the component does
      # not exist.
      - run: cargo +nightly miri test -p chromulate-core

  profiles:
    name: Profiles match their captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The rule this enforces is the project's strictest: no fingerprint
      # constant may be written by hand. The golden tests check the computed
      # fingerprints; this rebuilds each profile from its capture bytes and
      # compares it with what the binary ships, so an edited constant fails
      # here rather than changing what a server sees.
      - run: cargo run --release -p chromulate-cli -- verify

  backend-seam:
    name: The TLS seam admits a second backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `chromulate-tls` claims a BoringSSL backend would be a trait
      # implementation rather than a rewrite of the connection path. That claim
      # is only worth anything if something checks it, and the only honest check
      # is a second implementation: `--cfg chromulate_mock_backend` points
      # `ActiveBackend` at a backend that shares no code and no types with
      # rustls, and `chromulate-http` has to build and pass its tests against it.
      #
      # A cfg flag rather than a cargo feature, deliberately. Features must be
      # additive and `--all-features` would switch this one on, which would mean
      # every other job believing it exercised TLS while linking a backend that
      # encrypts nothing.
      #
      # `-p chromulate` is in this list because leaving it out is what let the
      # facade stop compiling under the flag without anything noticing: it named
      # the concrete `TlsEngine` where `chromulate-http` takes `ActiveBackend`,
      # so the crate that is this project's public face was the one crate the
      # seam's own job never built.
      - run: cargo clippy -p chromulate-tls -p chromulate-http -p chromulate --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg chromulate_mock_backend
      - run: cargo test -p chromulate-tls -p chromulate-http -p chromulate
        env:
          RUSTFLAGS: --cfg chromulate_mock_backend

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `cargo deny` covers advisories, licences, duplicate versions and source
      # registries in one pass, against the policy in `deny.toml`. It is a
      # separate job because it depends on an advisory database that changes
      # without this repository changing: a red build here can mean "someone
      # published an advisory overnight", which is exactly what it is for.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A dependency nobody uses still costs compile time, still appears in
      # `cargo deny`'s advisory surface, and still misleads a reader about what
      # the crate touches. Two false positives are recorded with reasons in
      # `[package.metadata.cargo-machete]` sections next to the dependency.
      - run: cargo install cargo-machete --locked
      - run: cargo machete

  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # The workspace excludes `fuzz/`, so the ordinary `fmt` job never sees it.
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      # `+nightly` is load-bearing for the same reason it is on the Miri job:
      # `rust-toolchain.toml` pins this repository to stable, and a toolchain
      # file wins over whatever the action installed.
      - run: cargo +nightly fuzz build
      # Sixty seconds per target catches a target that stopped building or that
      # panics on its own seeds. It is not a search, and is not meant to read as
      # one: finding anything deeper takes hours on a machine that has them.
      # Pull requests stop at the build above; the runs happen on the nightly
      # schedule, where a slow job blocks nobody.
      # The scratch directory is first so libFuzzer's discoveries land there and
      # the seeds committed to git stay read-only.
      - name: Run each target against its seeds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" \
              "$(mktemp -d)" "fuzz/corpus/$target" \
              -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  network:
    name: Live network tests
    runs-on: ubuntu-latest
    # Reaching the public internet makes this job inherently flaky, so it reports
    # separately rather than blocking a merge on someone else's outage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features network-tests -- --ignored
